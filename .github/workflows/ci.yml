name: Ruta checks
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
jobs:
  web-api-mobile:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ruta
          POSTGRES_PASSWORD: ruta
          POSTGRES_DB: ruta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ruta -d ruta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ruta:ruta@localhost:5432/ruta?schema=public
      AUTH_TOKEN_SECRET: ruta-ci-test-secret-with-more-than-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install monorepo dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Apply database migrations
        run: npm run db:migrate:deploy
      - name: Test passenger booking and reservation lifecycle
        run: npm run test:backend
      - name: Build browser website
        run: npm run build
      - name: Check backend entry syntax
        run: node --check backend/src/server.js
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm install --no-audit --no-fund
      - name: Bundle Android mobile app
        working-directory: apps/mobile
        run: npx expo export --platform android
