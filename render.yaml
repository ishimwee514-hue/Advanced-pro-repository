services:
  - type: web
    name: ruta-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_TOKEN_SECRET
        sync: false
      - key: WEB_ORIGIN
        sync: false
